apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitoring-agent
  namespace: monitoring
  labels:
    app: k8s-monitoring-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-monitoring-agent
  template:
    metadata:
      labels:
        app: k8s-monitoring-agent
    spec:
      serviceAccountName: k8s-monitoring-agent
      containers:
      - name: agent
        image: zensmartpocorg/k8s-monitoring-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CLUSTER_NAME
          value: "my-production-cluster"
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: metrics-api-secret
              key: token
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: http
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /ready
        #     port: http
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-monitoring-agent
  namespace: monitoring
spec:
  selector:
    app: k8s-monitoring-agent
  ports:
  - port: 8080
    targetPort: http
  type: ClusterIP