apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-monitoring-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitoring-agent
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "pods", "nodes/stats"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitoring-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-monitoring-agent
subjects:
- kind: ServiceAccount
  name: k8s-monitoring-agent
  namespace: monitoring