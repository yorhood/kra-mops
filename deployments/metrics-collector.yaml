apiVersion: v1
kind: Service
metadata:
  name: metrics-collector
  namespace: monitoring
spec:
  selector:
    app: metrics-collector
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: monitoring
  labels:
    app: metrics-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      containers:
      - name: collector
        image: hashicorp/http-echo:latest
        args:
        - -text="Metrics collector endpoint - POST your metrics here"
        - -listen=:8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"